services:
  inventory_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set. Create a local .env file from .env.example and set a strong password.}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - inventory_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  inventory_sql_data:
